# Wöchentliche Updates für npm-Pakete und die (auf Commit-Hashes festgelegten) GitHub Actions.
# Cooldown: neue Versionen erst nach 7 Tagen vorschlagen – kompromittierte Releases fallen meist vorher auf.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      entwicklung:
        dependency-type: development
      laufzeit:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
