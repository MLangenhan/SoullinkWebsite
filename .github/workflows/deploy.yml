# Baut die Website und veröffentlicht sie auf GitHub Pages (bei jedem Push auf main oder manuell).
# Benötigte Repository-Variablen (Settings → Secrets and variables → Actions → Variables):
#   SUPABASE_URL               https://<projekt-ref>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY   sb_publishable_… (öffentlicher Schlüssel, kein Geheimnis)
# Optional: BASE_PATH, z. B. "/" bei eigener Domain (Standard: /<Repository-Name>/)
name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages liest die Pages-Einstellungen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      # GitHub Pages kennt keine Weiterleitungen: Unterseiten wie /c/<adresse> lädt die App über die 404-Seite
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # Website veröffentlichen
      id-token: write # OIDC-Nachweis für deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
