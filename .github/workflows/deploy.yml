# Baut die Website und veröffentlicht sie auf GitHub Pages (bei jedem Push auf main oder manuell).
# Benötigte Repository-Variablen (Settings → Secrets and variables → Actions → Variables):
#   SUPABASE_URL               https://<projekt-ref>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY   sb_publishable_… (öffentlicher Schlüssel, kein Geheimnis)
# Optional: BASE_PATH, z. B. "/" bei eigener Domain (Standard: /<Repository-Name>/)
name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      # GitHub Pages kennt keine Weiterleitungen: Unterseiten wie /c/<adresse> lädt die App über die 404-Seite
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
